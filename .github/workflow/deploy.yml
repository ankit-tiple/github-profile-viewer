name: Deploy Next js Gtihub Profile Viewer App
on:
  push:
    branches:
      - main
  workflow-dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Step Up Node
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Install Dependencies
    run: npm ci

  - name: Run Build
    run: next build
